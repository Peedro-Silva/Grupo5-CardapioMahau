<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Área Externa</title>

    <link rel="stylesheet" href="./estilizacoes/style-mesas-areaExterna.css">
</head>

<body>
    <h1 class="titulo">Mesas</h1>

    <div class="nomeArea">
        <a href="./mesas.html"><img src="./imagens/img-seta.png" alt="seta-para-voltar-para-a-navegacao"
                width="50px"></a>
        <h2><em>Área Externa</em></h2>
    </div>

    <div class="quadro">
        <div class="bola-verde">Diego</div>
        <div class="bola-verde">Ana</div>
        <div class="bola-cinza"></div>
        <div class="bola-azul">Pedro</div>
        <div class="bola-azul">Higor</div>
        <div class="bola-verde">Yuri</div>
        <div class="bola-cinza"></div>
        <div class="bola-cinza"></div>
        <div class="bola-cinza"></div>
        <div class="bola-verde">Bruno</div>
        <div class="bola-verde">Cesar</div>
        <div class="bola-azul">Yoda</div>
        <div class="bola-cinza"></div>
        <div class="bola-verde">Astro</div>
        <div class="bola-verde">Buiudo</div>
        <div class="bola-verde">Sith</div>
        <div class="bola-azul">Força</div>
        <div class="bola-azul">Yamada</div>
        <div class="bola-azul">Honda</div>
        <div class="bola-verde">Yamaha</div>
        <div class="bola-cinza"></div>
        <div class="bola-verde">Rolex</div>
        <div class="bola-azul">Leon</div>
        <div class="bola-azul">Timóteo</div>
    </div>

    <div class="cadastro-mesa">
        <h3>Adicionar nova reserva</h3>
        <br>
        <form action="">
            <label for="nome">Nome:</label>
            <input type="text" name="nome" id="nome" required placeholder="Escreva o nome da reserva aqui...">
            <br>
            <label for="nome">Local</label>
            <select name="areas" id="areas">
                <option value="">Selecione</option>
                <option value="areaEterna">Área Externa</option>
                <option value="areaInterna">Área Interna</option>
                <option value="segundoAndar">2° Andar</option>
            </select>
            <br>
            <button type="submit">Cadastrar Reserva</button>
        </form>
    </div>
</body>

</html>
